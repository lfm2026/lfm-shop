<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat with GoNeo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f3f4f6;
            --chat-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
            --primary: #2563eb;
            --user-msg: #2563eb;
            --bot-msg: #f3f4f6;
            --icon-color: #4b5563;
        }

        body.dark-mode {
            --bg-color: #09090b;
            --chat-bg: #18181b;
            --text-color: #f4f4f5;
            --border-color: #27272a;
            --primary: #3b82f6;
            --user-msg: #2563eb;
            --bot-msg: #27272a;
            --icon-color: #ffffff;
        }

        body.dark-mode p, 
        body.dark-mode h1, 
        body.dark-mode h2, 
        body.dark-mode h3, 
        body.dark-mode span, 
        body.dark-mode i,
        body.dark-mode button:not(.send-btn) {
            color: #ffffff !important;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            transition: background 0.2s, color 0.2s; 
        }
        
        html, body { 
            background: var(--bg-color); 
            color: var(--text-color); 
            height: 100vh; 
            height: -webkit-fill-available;
            width: 100vw;
            overflow: hidden; 
            position: fixed; 
        }

        .chat-container {
            width: 100%;
            height: 100%;
            max-width: 768px;
            margin: 0 auto;
            background: var(--chat-bg);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        header {
            height: 60px;
            padding: 0 1.25rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--chat-bg);
            z-index: 10;
            flex-shrink: 0;
        }

        .brand {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .header-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 50%;
            color: var(--icon-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-dropdown {
            display: none;
            position: absolute;
            top: 55px;
            right: 1.25rem;
            background: var(--chat-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            z-index: 100;
            width: 180px;
        }

        .menu-dropdown.active { display: block; }

        .menu-dropdown button {
            width: 100%;
            padding: 0.75rem 1rem;
            background: none;
            border: none;
            text-align: left;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-color);
        }

        .menu-dropdown button:hover {
            background: var(--bg-color);
        }

        .chat-messages {
            flex: 1;
            padding: 1.25rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            -webkit-overflow-scrolling: touch;
        }

        .msg {
            max-width: 82%;
            padding: 0.75rem 1rem;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .msg.user {
            align-self: flex-end;
            background: var(--user-msg);
            color: #ffffff !important;
            border-bottom-right-radius: 2px;
        }

        .msg.bot {
            align-self: flex-start;
            background: var(--bot-msg);
            border-bottom-left-radius: 2px;
        }

        /* Fixed Separate Bottom Input Layer */
        .chat-input-wrapper {
            position: sticky;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--chat-bg);
            border-top: 1px solid var(--border-color);
            padding: 0.75rem 1rem;
            padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
            z-index: 20;
            flex-shrink: 0;
        }

        .chat-input-area {
            display: flex;
            gap: 0.6rem;
            align-items: center;
            width: 100%;
        }

        .chat-input-area input {
            flex: 1;
            padding: 0.75rem 1rem;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            outline: none;
            font-size: 0.95rem;
            color: var(--text-color);
        }

        .send-btn {
            background: var(--primary);
            color: #ffffff !important;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* Modals */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active { display: flex; }

        .modal-card {
            background: var(--chat-bg);
            border: 1px solid var(--border-color);
            padding: 1.75rem;
            border-radius: 16px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
        }

        .modal-card h3 { margin-bottom: 0.5rem; text-align: center; }
        .modal-card p { font-size: 0.88rem; opacity: 0.8; margin-bottom: 1.25rem; text-align: center; }

        .modal-input {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 0.8rem;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            color: var(--text-color);
        }

        .submit-btn {
            width: 100%;
            padding: 0.75rem;
            background: var(--primary);
            color: #ffffff !important;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.4rem;
        }

        .auth-switch {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
            font-size: 0.85rem;
        }

        .auth-switch span {
            color: var(--primary);
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Header -->
        <header>
            <div class="brand">Chat with GoNeo</div>
            <div class="header-actions">
                <button class="icon-btn" onclick="toggleTheme()" id="theme-btn">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <button class="icon-btn" onclick="toggleMenu()">
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </button>
            </div>

            <!-- Dropdown Menu -->
            <div class="menu-dropdown" id="dropdown-menu">
                <button onclick="clearHistory()"><i class="fa-solid fa-trash"></i> হিস্ট্রি মুছুন</button>
                <button onclick="openReportModal()"><i class="fa-solid fa-flag"></i> রিপোর্ট করুন</button>
            </div>
        </header>

        <!-- Messages Area -->
        <div class="chat-messages" id="chat-box">
            <div class="msg bot">হ্যালো! আমি GoNeo AI। আপনাকে কীভাবে সাহায্য করতে পারি?</div>
        </div>

        <!-- Separate Fixed Bottom Input Layer -->
        <div class="chat-input-wrapper">
            <div class="chat-input-area">
                <input type="text" id="chat-msg" placeholder="বার্তা লিখুন..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="handleSend()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- Login / Signup Modal -->
    <div class="modal-overlay" id="auth-modal">
        <div class="modal-card">
            <h3 id="auth-title">সাইন-ইন করুন</h3>
            <p id="auth-desc">GoNeo-তে চ্যাট চালাতে মোবাইল ও পাসওয়ার্ড দিয়ে সাইন-ইন করুন।</p>
            
            <input type="tel" id="auth-mobile" class="modal-input" placeholder="মোবাইল নম্বর">
            <input type="password" id="auth-password" class="modal-input" placeholder="পাসওয়ার্ড">

            <button class="submit-btn" onclick="submitAuth()" id="auth-btn">সাইন-ইন</button>

            <div class="auth-switch">
                <span id="switch-text">অ্যাকাউন্ট নেই? সাইন-আপ করুন</span>
            </div>
            <button style="background: transparent; border: none; font-size: 0.8rem; cursor: pointer; opacity: 0.7; width: 100%; margin-top: 0.8rem;" onclick="closeAuthModal()">পরে করবো</button>
        </div>
    </div>

    <!-- Report Modal -->
    <div class="modal-overlay" id="report-modal">
        <div class="modal-card">
            <h3>রিপোর্ট বা অভিযোগ দিন</h3>
            <p>আপনার কোনো সমস্যা থাকলে তা অ্যাডমিনকে জানান।</p>

            <input type="tel" id="report-mobile" class="modal-input" placeholder="আপনার মোবাইল নম্বর">
            <input type="text" id="report-issue" class="modal-input" placeholder="সমস্যার ধরন (যেমন: Delivery/Bot Issue)">
            <textarea id="report-msg" class="modal-input" rows="3" placeholder="বিস্তারিত লিখুন..."></textarea>

            <button class="submit-btn" onclick="submitReport()">রিপোর্ট পাঠান</button>
            <button style="background: transparent; border: none; font-size: 0.8rem; cursor: pointer; opacity: 0.7; width: 100%; margin-top: 0.8rem;" onclick="closeReportModal()">বাতিল</button>
        </div>
    </div>

    <script>
        let isLoggedIn = false;
        let isSignUp = false;
        let pendingMessage = "";
        let currentUserMobile = "";

        // Load Chat History on Page Load
        window.addEventListener('DOMContentLoaded', () => {
            loadHistory();
        });

        function saveHistory() {
            const chatBox = document.getElementById('chat-box');
            localStorage.setItem('goneo_chat_history', chatBox.innerHTML);
        }

        function loadHistory() {
            const savedHistory = localStorage.getItem('goneo_chat_history');
            if (savedHistory) {
                document.getElementById('chat-box').innerHTML = savedHistory;
                scrollToBottom();
            }
        }

        function clearHistory() {
            if (confirm("আপনি কি নিশ্চিত যে সকল চ্যাট হিস্ট্রি মুছে ফেলতে চান?")) {
                localStorage.removeItem('goneo_chat_history');
                document.getElementById('chat-box').innerHTML = '<div class="msg bot">হ্যালো! আমি GoNeo AI। আপনাকে কীভাবে সাহায্য করতে পারি?</div>';
                toggleMenu();
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const icon = document.querySelector('#theme-btn i');
            if (document.body.classList.contains('dark-mode')) {
                icon.className = 'fa-solid fa-sun';
            } else {
                icon.className = 'fa-solid fa-moon';
            }
        }

        function toggleMenu() {
            document.getElementById('dropdown-menu').classList.toggle('active');
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') handleSend();
        }

        function scrollToBottom() {
            const box = document.getElementById('chat-box');
            box.scrollTop = box.scrollHeight;
        }

        function handleSend() {
            const input = document.getElementById('chat-msg');
            const msg = input.value.trim();
            if (!msg) return;

            if (!isLoggedIn) {
                pendingMessage = msg;
                document.getElementById('auth-modal').classList.add('active');
                return;
            }

            processMessage(msg);
            input.value = '';
        }

        document.getElementById('switch-text').addEventListener('click', function() {
            isSignUp = !isSignUp;
            if (isSignUp) {
                document.getElementById('auth-title').innerText = "সাইন-আপ করুন";
                document.getElementById('auth-desc').innerText = "GoNeo-তে নতুন অ্যাকাউন্ট খুলুন।";
                document.getElementById('auth-btn').innerText = "অ্যাকাউন্ট খুলুন";
                this.innerText = "অ্যাকাউন্ট আছে? সাইন-ইন করুন";
            } else {
                document.getElementById('auth-title').innerText = "সাইন-ইন করুন";
                document.getElementById('auth-desc').innerText = "GoNeo-তে চ্যাট চালাতে পাসওয়ার্ড দিয়ে প্রবেশ করুন।";
                document.getElementById('auth-btn').innerText = "সাইন-ইন";
                this.innerText = "অ্যাকাউন্ট নেই? সাইন-আপ করুন";
            }
        });

        function closeAuthModal() {
            document.getElementById('auth-modal').classList.remove('active');
            if (pendingMessage) {
                processMessage(pendingMessage);
                document.getElementById('chat-msg').value = '';
                pendingMessage = "";
            }
        }

        function submitAuth() {
            const mobile = document.getElementById('auth-mobile').value.trim();
            const password = document.getElementById('auth-password').value.trim();

            if (!mobile || !password) return alert("মোবাইল ও পাসওয়ার্ড দিন!");

            currentUserMobile = mobile;
            isLoggedIn = true;
            closeAuthModal();
        }

        async function processMessage(msg) {
            const box = document.getElementById('chat-box');
            box.innerHTML += `<div class="msg user">${msg}</div>`;
            scrollToBottom();
            saveHistory();

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg, mobile: currentUserMobile })
                });
                
                if (!res.ok) throw new Error("Server error");

                const data = await res.json();
                box.innerHTML += `<div class="msg bot">${data.response}</div>`;
            } catch (e) {
                box.innerHTML += `<div class="msg bot">হ্যালো! আমি আপনার বার্তা পেয়েছি। আপনি কীভাবে সাহায্য চান?</div>`;
            }
            scrollToBottom();
            saveHistory();
        }

        function openReportModal() {
            document.getElementById('dropdown-menu').classList.remove('active');
            document.getElementById('report-modal').classList.add('active');
        }

        function closeReportModal() {
            document.getElementById('report-modal').classList.remove('active');
        }

        async function submitReport() {
            const mobile = document.getElementById('report-mobile').value.trim();
            const issue = document.getElementById('report-issue').value.trim();
            const message = document.getElementById('report-msg').value.trim();

            if (!mobile || !message) return alert("মোবাইল এবং বার্তার বিবরন দিন!");

            try {
                const res = await fetch('/api/report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mobile, issue_type: issue, message })
                });
                const data = await res.json();
                alert(data.message || "রিপোর্ট সফলভাবে জমা হয়েছে!");
            } catch(e) {
                alert("রিপোর্ট জমা হয়েছে।");
            }
            closeReportModal();
        }
    </script>
</body>
</html>
