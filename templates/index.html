<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>GoNio AI Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { display: flex; height: 100vh; background: #f4f6f8; }
        .sidebar { width: 260px; background: #1e293b; color: white; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .sidebar h2 { font-size: 20px; color: #38bdf8; }
        .btn { padding: 10px; background: #0284c7; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .chat-area { flex: 1; display: flex; flex-direction: column; }
        .chat-header { background: white; padding: 15px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 60%; padding: 10px 15px; border-radius: 10px; font-size: 15px; }
        .user { background: #0284c7; color: white; align-self: flex-end; }
        .bot { background: #e2e8f0; color: #333; align-self: flex-start; }
        .chat-input { padding: 15px; background: white; display: flex; gap: 10px; }
        .chat-input input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .ticket-box { background: #0f172a; padding: 10px; border-radius: 5px; font-size: 12px; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>GoNio Support</h2>
    <button class="btn" onclick="location.reload()">+ New Chat</button>
    
    <div style="margin-top:auto;">
        <h3>আপনার সাপোর্ট টিকিট</h3>
        <div id="tickets" class="ticket-box">লোডিং...</div>
    </div>
</div>

<div class="chat-area">
    <div class="chat-header">
        <h3>GoNio Bot</h3>
        <button onclick="reportIssue()" style="background:#ef4444;" class="btn">Report Problem</button>
    </div>

    <div class="messages" id="chatBox">
        <div class="msg bot">হ্যালো! GoNio-তে আপনাকে স্বাগতম। কীভাবে সাহায্য করতে পারি?</div>
    </div>

    <div class="chat-input">
        <input type="text" id="userInput" placeholder="এখানে লিখুন...">
        <button class="btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    let currentSessionId = null;

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        appendMessage('user', text);
        input.value = '';

        const res = await fetch('/get_response', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ message: text, session_id: currentSessionId })
        });
        const data = await res.json();
        currentSessionId = data.session_id;
        appendMessage('bot', data.response);
    }

    function appendMessage(sender, text) {
        const box = document.getElementById('chatBox');
        const div = document.createElement('div');
        div.className = `msg ${sender}`;
        div.innerText = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    async function reportIssue() {
        const issue = prompt("কী সমস্যা হচ্ছে বিস্তারিত লিখুন:");
        if (!issue) return;

        const res = await fetch('/api/report', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ issue: issue })
        });
        const data = await res.json();
        alert(data.message);
        loadTickets();
    }

    async function loadTickets() {
        const res = await fetch('/api/user/reports');
        const data = await res.json();
        const box = document.getElementById('tickets');
        box.innerHTML = '';
        if(data.length === 0) box.innerHTML = "কোনো টিকিট নেই";
        data.forEach(t => {
            box.innerHTML += `
                <div style="margin-bottom:8px; border-bottom:1px solid #334155; padding-bottom:5px;">
                    <b>সমস্যা:</b> ${t.issue}<br>
                    <b>স্ট্যাটাস:</b> ${t.status === 'pending' ? '⏳ অপেক্ষমাণ' : '✅ উত্তর দেওয়া হয়েছে'}<br>
                    ${t.reply ? `<span style="color:#38bdf8;"><b>উত্তর:</b> ${t.reply}</span>` : ''}
                </div>
            `;
        });
    }

    loadTickets();
</script>
</body>
</html>
