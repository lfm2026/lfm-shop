<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoNeo AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 90vh;
            background-color: #1e293b;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .chat-header {
            padding: 15px;
            background-color: #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header select {
            padding: 6px 10px;
            border-radius: 6px;
            border: none;
            background-color: #0f172a;
            color: #fff;
            outline: none;
        }
        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.4;
        }
        .user-message {
            align-self: flex-end;
            background-color: #2563eb;
            color: #fff;
        }
        .bot-message {
            align-self: flex-start;
            background-color: #475569;
            color: #fff;
        }
        .chat-input {
            display: flex;
            padding: 10px;
            background-color: #334155;
            gap: 8px;
        }
        .chat-input input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            outline: none;
            background-color: #0f172a;
            color: #fff;
        }
        .chat-input button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            background-color: #2563eb;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
        }
        .chat-input button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <h3>GoNeo AI</h3>
        <select id="model-select">
            <option value="groq">Groq (Llama 3.3)</option>
            <option value="gemini">Google Gemini</option>
        </select>
    </div>

    <div class="chat-box" id="chat-box">
        <div class="message bot-message">হ্যালো! আমি GoNeo AI। আপনাকে কীভাবে সাহায্য করতে পারি?</div>
    </div>

    <div class="chat-input">
        <input type="text" id="user-input" placeholder="আপনার বার্তা লিখুন..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    // আপনার Render ব্যাকএন্ড URL নিচে বসান
    const BACKEND_URL = "https://your-render-app-name.onrender.com";

    async function sendMessage() {
        const inputField = document.getElementById("user-input");
        const messageText = inputField.value.trim();
        const modelSelect = document.getElementById("model-select").value;
        const chatBox = document.getElementById("chat-box");

        if (!messageText) return;

        // ইউজার মেসেজ স্ক্রিনে দেখানো
        appendMessage(messageText, "user-message");
        inputField.value = "";

        // লোডিং মেসেজ দেখানো
        const loadingDiv = document.createElement("div");
        loadingDiv.className = "message bot-message";
        loadingDiv.innerText = "অপেক্ষা করুন...";
        chatBox.appendChild(loadingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const endpoint = modelSelect === "gemini" ? "/chat/gemini" : "/chat/groq";
            const response = await fetch(`${BACKEND_URL}${endpoint}`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ message: messageText })
            });

            const data = await response.json();
            chatBox.removeChild(loadingDiv);

            if (data.reply) {
                appendMessage(data.reply, "bot-message");
            } else {
                appendMessage("দুঃখিত, কোনো ত্রুটি ঘটেছে।", "bot-message");
            }
        } catch (error) {
            chatBox.removeChild(loadingDiv);
            appendMessage("সার্ভারে সংযোগ করা যাচ্ছে না।", "bot-message");
        }
    }

    function appendMessage(text, className) {
        const chatBox = document.getElementById("chat-box");
        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${className}`;
        messageDiv.innerText = text;
        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }
</script>

</body>
</html>
