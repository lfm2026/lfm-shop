<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat with GoNeo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f3f4f6;
            --chat-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
            --primary: #2563eb;
            --user-msg: #2563eb;
            --bot-msg: #f3f4f6;
            --icon-color: #4b5563;
        }

        body.dark-mode {
            --bg-color: #09090b;
            --chat-bg: #18181b;
            --text-color: #f4f4f5;
            --border-color: #27272a;
            --primary: #3b82f6;
            --user-msg: #2563eb;
            --bot-msg: #27272a;
            --icon-color: #ffffff;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        
        html, body { 
            background: var(--bg-color); 
            color: var(--text-color); 
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
            position: fixed; 
        }

        .chat-container {
            width: 100%;
            height: 100%;
            max-width: 768px;
            margin: 0 auto;
            background: var(--chat-bg);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        header {
            height: 60px;
            padding: 0 1.25rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--chat-bg);
            z-index: 10;
            flex-shrink: 0;
        }

        .brand {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .header-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 50%;
            color: var(--icon-color);
        }

        .menu-dropdown {
            display: none;
            position: absolute;
            top: 55px;
            right: 1.25rem;
            background: var(--chat-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            z-index: 100;
            width: 180px;
        }

        .menu-dropdown.active { display: block; }

        .menu-dropdown button {
            width: 100%;
            padding: 0.75rem 1rem;
            background: none;
            border: none;
            text-align: left;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-color);
        }

        .chat-messages {
            flex: 1;
            padding: 1.25rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            -webkit-overflow-scrolling: touch;
        }

        .msg {
            max-width: 82%;
            padding: 0.75rem 1rem;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .msg.user {
            align-self: flex-end;
            background: var(--user-msg);
            color: #ffffff !important;
            border-bottom-right-radius: 2px;
        }

        .msg.bot {
            align-self: flex-start;
            background: var(--bot-msg);
            border-bottom-left-radius: 2px;
        }

        /* Fixed Layer for Input Box */
        .chat-input-wrapper {
            position: sticky;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--chat-bg);
            border-top: 1px solid var(--border-color);
            padding: 0.75rem 1rem;
            padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
            z-index: 20;
            flex-shrink: 0;
        }

        .chat-input-area {
            display: flex;
            gap: 0.6rem;
            align-items: center;
            width: 100%;
        }

        .chat-input-area input {
            flex: 1;
            padding: 0.75rem 1rem;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            outline: none;
            font-size: 0.95rem;
            color: var(--text-color);
        }

        .send-btn {
            background: var(--primary);
            color: #ffffff !important;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Header -->
        <header>
            <div class="brand">Chat with GoNeo</div>
            <div class="header-actions">
                <button class="icon-btn" onclick="toggleTheme()" id="theme-btn">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <button class="icon-btn" onclick="toggleMenu()">
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </button>
            </div>

            <div class="menu-dropdown" id="dropdown-menu">
                <button onclick="clearHistory()"><i class="fa-solid fa-trash"></i> হিস্ট্রি মুছুন</button>
            </div>
        </header>

        <!-- Messages Area -->
        <div class="chat-messages" id="chat-box">
            <div class="msg bot">হ্যালো! আমি GoNeo AI। আপনাকে কীভাবে সাহায্য করতে পারি?</div>
        </div>

        <!-- Fixed Input Box Layer -->
        <div class="chat-input-wrapper">
            <div class="chat-input-area">
                <input type="text" id="chat-msg" placeholder="বার্তা লিখুন..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="handleSend()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        // Load Chat History
        window.addEventListener('DOMContentLoaded', () => {
            loadHistory();
        });

        function saveHistory() {
            const chatBox = document.getElementById('chat-box');
            localStorage.setItem('goneo_chat_history', chatBox.innerHTML);
        }

        function loadHistory() {
            const savedHistory = localStorage.getItem('goneo_chat_history');
            if (savedHistory) {
                document.getElementById('chat-box').innerHTML = savedHistory;
                scrollToBottom();
            }
        }

        function clearHistory() {
            if (confirm("আপনি কি নিশ্চিত যে চ্যাট হিস্ট্রি মুছে ফেলতে চান?")) {
                localStorage.removeItem('goneo_chat_history');
                document.getElementById('chat-box').innerHTML = '<div class="msg bot">হ্যালো! আমি GoNeo AI। আপনাকে কীভাবে সাহায্য করতে পারি?</div>';
                toggleMenu();
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
        }

        function toggleMenu() {
            document.getElementById('dropdown-menu').classList.toggle('active');
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') handleSend();
        }

        function scrollToBottom() {
            const box = document.getElementById('chat-box');
            box.scrollTop = box.scrollHeight;
        }

        async function handleSend() {
            const input = document.getElementById('chat-msg');
            const msg = input.value.trim();
            if (!msg) return;

            const box = document.getElementById('chat-box');
            box.innerHTML += `<div class="msg user">${msg}</div>`;
            input.value = '';
            scrollToBottom();
            saveHistory();

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg })
                });
                
                const data = await res.json();
                box.innerHTML += `<div class="msg bot">${data.response}</div>`;
            } catch (e) {
                box.innerHTML += `<div class="msg bot">দুঃখিত, কোনো সমস্যা হয়েছে। আবার চেষ্টা করুন।</div>`;
            }
            scrollToBottom();
            saveHistory();
        }
    </script>
</body>
</html>
