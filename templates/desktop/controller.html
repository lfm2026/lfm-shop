<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LFM Shop - Controller Panel</title>
    <link rel="stylesheet" href="/static/css/main_toffee.css">
    <style>
        .ctrl-container { padding: 20px; max-width: 900px; margin: auto; }
        .card { background: #1E0038; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #3A0066; }
        input { width: 100%; padding: 10px; margin: 6px 0 12px 0; border-radius: 5px; border: none; }
        .btn-save { background: #008CBA; color: white; border: none; padding: 10px; cursor: pointer; border-radius: 5px; }
        .btn-block { background: #f44336; color: white; padding: 5px 10px; border: none; cursor: pointer; border-radius: 3px; }
    </style>
</head>
<body class="toffee-theme">
    <header class="navbar">
        <div class="logo">LFM CONTROLLER PANEL</div>
    </header>

    <div class="ctrl-container">
        <!-- সোশ্যাল লিংকস ও কন্টাক্ট কনফিগারেশন -->
        <div class="card">
            <h2>সোশ্যাল লিংকস ও কন্টাক্ট ইনফো আপডেট</h2>
            <form action="/controller/update-config" method="POST">
                <label>WhatsApp নম্বর:</label>
                <input type="text" name="whatsapp_number" value="{{ config.whatsapp_number }}">

                <label>Messenger ইনবক্স লিংক:</label>
                <input type="text" name="messenger_link" value="{{ config.messenger_link }}">

                <label>Facebook পেজ লিংক:</label>
                <input type="text" name="facebook_page" value="{{ config.facebook_page }}">

                <label>YouTube চ্যানেল লিংক:</label>
                <input type="text" name="youtube_link" value="{{ config.youtube_link }}">

                <label>TikTok প্রোফাইল লিংক:</label>
                <input type="text" name="tiktok_link" value="{{ config.tiktok_link }}">

                <label>Instagram প্রোফাইল লিংক:</label>
                <input type="text" name="instagram_link" value="{{ config.instagram_link }}">

                <label>কন্টাক্ট Gmail:</label>
                <input type="text" name="gmail_contact" value="{{ config.gmail_contact }}">

                <button type="submit" class="btn-save">সবগুলো সেভ করুন</button>
            </form>
        </div>

        <!-- ইউজার অ্যাকাউন্ট ম্যানেজমেন্ট -->
        <div class="card">
            <h2>ইউজার অ্যাকাউন্ট কন্ট্রোল</h2>
            <table style="width:100%; text-align:left; color:#fff;">
                <thead>
                    <tr>
                        <th>ইউজার টোকেন</th>
                        <th>নাম / নম্বর</th>
                        <th>স্ট্যাটাস</th>
                        <th>একশন</th>
                    </tr>
                </thead>
                <tbody>
                    {% for user in users %}
                    <tr>
                        <td>{{ user.token }}</td>
                        <td>{{ user.name }} ({{ user.phone }})</td>
                        <td>{% if user.is_blocked %}<b style="color:red;">Blocked</b>{% else %}<b style="color:green;">Active</b>{% endif %}</td>
                        <td>
                            <form action="/controller/toggle-user-block" method="POST">
                                <input type="hidden" name="user_token" value="{{ user.token }}">
                                <button type="submit" class="btn-block">{% if user.is_blocked %}Unblock{% else %}Block{% endif %}</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
