<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LFM Shop - Admin Panel</title>
    <link rel="stylesheet" href="/static/css/main_toffee.css">
    <style>
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px; }
        .form-box, .order-box { background: #1E0038; padding: 20px; border-radius: 10px; border: 1px solid #3A0066; }
        input, select, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 5px; border: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; color: #fff; }
        th, td { border: 1px solid #3A0066; padding: 8px; text-align: left; font-size: 13px; }
        th { background: #2D004D; }
    </style>
</head>
<body class="toffee-theme">
    <header class="navbar">
        <div class="logo">LFM ADMIN PANEL</div>
        <div><a href="/" style="color:#FFD700; text-decoration:none;">ওয়েবসাইট দেখুন</a></div>
    </header>

    <div class="admin-grid">
        <!-- প্রোডাক্ট আপলোড ফর্ম -->
        <div class="form-box">
            <h2>নতুন পণ্য আপলোড</h2>
            <form id="uploadForm" action="/admin/upload-product" method="POST">
                <input type="text" name="title" placeholder="প্রোডাক্ট নাম" required>
                <input type="text" name="category" placeholder="টাইপ/ক্যাটাগরি (e.g. T-Shirt, Pant)" required>
                <input type="text" name="colors" placeholder="এভেলেবল কালার (e.g. Red, Black)" required>
                <input type="text" name="sizes" placeholder="এভেলেবল সাইজ (e.g. S, M, L)" required>
                <input type="number" name="stock" placeholder="স্টক সংখ্যা" required>
                <input type="number" step="0.01" name="price" placeholder="মূল্য (৳)" required>
                <input type="number" step="0.01" name="weight_kg" placeholder="ওজন (কেজি, e.g. 0.25)" value="0.25">
                <input type="text" name="pic_urls" placeholder="ছবি URL (কমা দিয়ে একাধিক)" required>
                <input type="text" name="video_urls" placeholder="ভিডিও URL (অপশনাল)">
                <button type="submit" id="subBtn" class="btn-buy" style="cursor:pointer;">আপলোড করুন</button>
            </form>
        </div>

        <!-- অর্ডার ম্যানেজমেন্ট -->
        <div class="order-box">
            <h2>অর্ডার তালিকা ও আপডেট</h2>
            <table>
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>গ্রাহক ও মোবাইল</th>
                        <th>প্রোডাক্ট ID</th>
                        <th>স্ট্যাটাস</th>
                        <th>একশন</th>
                    </tr>
                </thead>
                <tbody>
                    {% for order in orders %}
                    <tr>
                        <td>{{ order.order_id }}</td>
                        <td>{{ order.customer_name }}<br>({{ order.phone }})</td>
                        <td>{{ order.product_id }}</td>
                        <td><b>{{ order.status }}</b></td>
                        <td>
                            <form action="/admin/update-order-status" method="POST">
                                <input type="hidden" name="order_id" value="{{ order.order_id }}">
                                <select name="status" onchange="this.form.submit()">
                                    <option value="">পরিবর্তন করুন</option>
                                    <option value="Approved">Approve</option>
                                    <option value="On Road">On Road</option>
                                    <option value="Delivered">Delivered</option>
                                    <option value="Cancelled">Cancel</option>
                                </select>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // আপলোডের সময় ডাবল সাবমিশন রোধ লজিক
        document.getElementById('uploadForm').addEventListener('submit', function() {
            var btn = document.getElementById('subBtn');
            btn.disabled = true;
            btn.style.background = '#555';
            btn.innerText = 'অপেক্ষা করুন... Uploading Pending...';
        });
    </script>
</body>
    </html>
