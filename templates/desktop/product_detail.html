<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.title }} - LFM Shop</title>
    <link rel="stylesheet" href="/static/css/main_toffee.css">
    <style>
        .product-container { display: flex; flex-wrap: wrap; gap: 30px; padding: 20px; max-width: 1100px; margin: auto; }
        .gallery-box { flex: 1; min-width: 300px; }
        .main-img { width: 100%; border-radius: 10px; border: 2px solid #3A0066; cursor: pointer; }
        .thumb-list { display: flex; gap: 10px; margin-top: 10px; }
        .thumb-img { width: 60px; height: 60px; border-radius: 5px; cursor: pointer; border: 1px solid #D4AF37; }
        .details-box { flex: 1; min-width: 300px; background: #1E0038; padding: 25px; border-radius: 10px; border: 1px solid #3A0066; }
        .product-id-badge { background: #FFD700; color: #000; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 13px; display: inline-block; }
        .price-tag { font-size: 26px; color: #FF0055; font-weight: bold; margin: 15px 0; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #D4AF37; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 5px; border: none; background: #2D004D; color: #fff; }
        .btn-order { background: linear-gradient(90deg, #FF0055, #FFD700); color: #fff; width: 100%; padding: 12px; font-size: 18px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; }
        /* Image Zoom Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 1000; }
        .modal img { max-width: 90%; max-height: 90%; border-radius: 8px; }
    </style>
</head>
<body class="toffee-theme">
    <header class="navbar">
        <div class="logo"><a href="/" style="color:#FFD700; text-decoration:none;">LFM SHOP</a></div>
        <div><a href="/cart" style="color:#fff;">🛒 Cart</a></div>
    </header>

    <div class="product-container">
        <!-- প্রোডাক্ট ফটো গ্যালারি -->
        <div class="gallery-box">
            <img id="currentImg" src="{{ product.pic_urls[0] }}" class="main-img" onclick="openZoom()">
            <div class="thumb-list">
                {% for pic in product.pic_urls %}
                <img src="{{ pic }}" class="thumb-img" onclick="changeImage('{{ pic }}')">
                {% endfor %}
            </div>
        </div>

        <!-- প্রোডাক্ট ডিটেইলস ও অর্ডার ফর্ম -->
        <div class="details-box">
            <h2>{{ product.title }}</h2>
            <span class="product-id-badge">ID: {{ product.product_id }}</span>
            <div class="price-tag">৳ {{ product.price }}</div>

            <form action="/checkout" method="POST" id="checkoutForm">
                <input type="hidden" name="product_id" value="{{ product.product_id }}">
                
                <div class="form-group">
                    <label>কালার:</label>
                    <input type="text" name="color" value="{{ product.color }}" readonly>
                </div>

                <div class="form-group">
                    <label>সাইজ:</label>
                    <input type="text" name="size" value="{{ product.size }}" readonly>
                </div>

                <div class="form-group">
                    <label>পরিমাণ (কয়টি নিবেন):</label>
                    <input type="number" name="quantity" value="1" min="1" required>
                </div>

                <div class="form-group">
                    <label>আপনার নাম:</label>
                    <input type="text" name="name" required placeholder="আপনার পূর্ণ নাম">
                </div>

                <div class="form-group">
                    <label>মোবাইল নম্বর:</label>
                    <input type="text" name="phone" required placeholder="018XXXXXXXX">
                </div>

                <div class="form-group">
                    <label>ঠিকানা (গ্রাম, থানা, জেলা):</label>
                    <input type="text" name="address" required placeholder="আপনার সম্পূর্ণ ঠিকানা">
                </div>

                <button type="submit" class="btn-order">অর্ডার কনফার্ম করুন</button>
            </form>
        </div>
    </div>

    <!-- জুম ছবি পপ-আপ -->
    <div id="imgModal" class="modal" onclick="closeZoom()">
        <img id="modalImg" src="">
    </div>

    <script>
        function changeImage(src) {
            document.getElementById('currentImg').src = src;
        }
        function openZoom() {
            document.getElementById('modalImg').src = document.getElementById('currentImg').src;
            document.getElementById('imgModal').style.display = 'flex';
        }
        function closeZoom() {
            document.getElementById('imgModal').style.display = 'none';
        }
    </script>
</body>
</html>
