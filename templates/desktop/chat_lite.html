<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>LFM Neo AI Support - Lite</title>
    <style>
        body { font-family: sans-serif; margin: 5px; background: #fff; }
        .header { background: #4B0082; color: #fff; padding: 5px; text-align: center; }
        .chat-box { border: 1px solid #ccc; padding: 5px; margin: 5px 0; background: #f9f9f9; }
        .btn-send { background: #4B0082; color: #fff; padding: 5px 10px; border: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h3>LFM Neo AI (Lite Chat)</h3>
    </div>
    <a href="/">← হোমপেজে ফিরে যান</a>
    <hr>

    <div class="chat-box">
        <p><b>LFM Neo:</b> আসসালামু আলাইকুম! আমি LFM Neo, আপনাকে কীভাবে সাহায্য করতে পারি? (পণ্য নির্বাচন, পলিসি জানা বা অর্ডার ক্যানসেলের জন্য লিখে পাঠান)</p>
    </div>

    <form action="/api/ai-chat" method="POST">
        মেসেজ লিখুন:<br>
        <textarea name="message" style="width:95%; height:60px;" required></textarea><br><br>
        <input type="submit" class="btn-send" value="মেসেজ পাঠান">
    </form>
</body>
</html>
