<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LFM Admin Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #1e293b; color: #fff; display: flex; justify-content: center; padding-top: 30px; }
        .admin-box { width: 100%; max-width: 600px; background: #0f172a; border-radius: 10px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
        .msg-list { height: 400px; overflow-y: auto; background: #1e293b; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px; border-radius: 6px; font-size: 14px; }
        .msg.customer { align-self: flex-start; background: #334155; color: #f8fafc; }
        .msg.admin { align-self: flex-end; background: #16a34a; color: #fff; }
        .reply-box { display: flex; margin-top: 15px; gap: 10px; }
        .reply-box input { flex: 1; padding: 12px; border-radius: 6px; border: none; outline: none; }
        .reply-box button { padding: 12px 20px; background: #16a34a; border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="admin-box">
        <h2>LFM Admin Live Chat</h2>
        <div class="msg-list" id="adminMsgList"></div>
        <div class="reply-box">
            <input type="text" id="adminReply" placeholder="কাস্টমারকে রিপ্লাই দিন..." onkeydown="if(event.key==='Enter') sendAdminReply()">
            <button onclick="sendAdminReply()">Reply</button>
        </div>
    </div>

    <script>
        async function loadAdminMessages() {
            try {
                const res = await fetch('/api/get-messages');
                const data = await res.json();
                if(data.status === 'success') {
                    const list = document.getElementById('adminMsgList');
                    list.innerHTML = '';
                    data.messages.forEach(m => {
                        const div = document.createElement('div');
                        div.className = `msg ${m.sender}`;
                        div.textContent = `${m.sender.toUpperCase()}: ${m.message}`;
                        list.appendChild(div);
                    });
                    list.scrollTop = list.scrollHeight;
                }
            } catch(e) { console.error(e); }
        }

        async function sendAdminReply() {
            const input = document.getElementById('adminReply');
            const msg = input.value.trim();
            if(!msg) return;

            input.value = '';
            await fetch('/api/send-message', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ sender: 'admin', message: msg })
            });
            loadAdminMessages();
        }

        setInterval(loadAdminMessages, 3000);
        loadAdminMessages();
    </script>
</body>
</html>
